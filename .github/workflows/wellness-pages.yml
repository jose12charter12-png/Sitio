name: Deploy wellness portal preview
on:
  push:
    branches:
      - build/wellness-editorial-site
    paths:
      - 'wellness-portal/**'
      - '.github/workflows/wellness-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site for GitHub Pages
        run: |
          mkdir -p _site
          cp -R wellness-portal/. _site/
          find _site -type f -name '*.html' -exec sed -i \
            -e 's|href="/|href="/Sitio/|g' \
            -e 's|src="/|src="/Sitio/|g' \
            -e 's|url=/|url=/Sitio/|g' \
            -e 's|location.replace("/|location.replace("/Sitio/|g' \\
            -e 's|"/es/|"/Sitio/es/|g' \\
            -e 's|"/en/|"/Sitio/en/|g' \\
            -e 's|https://REPLACE-WITH-YOUR-DOMAIN|https://jose12charter12-png.github.io/Sitio|g' {} +
          sed -i 's|https://REPLACE-WITH-YOUR-DOMAIN|https://jose12charter12-png.github.io/Sitio|g; s|/sitemap.xml|/Sitio/sitemap.xml|g' _site/robots.txt
          sed -i 's|https://REPLACE-WITH-YOUR-DOMAIN|https://jose12charter12-png.github.io/Sitio|g' _site/sitemap.xml
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
